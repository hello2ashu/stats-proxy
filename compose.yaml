# Final stats-proxy service environment.
#
# Everything above the "--- New providers ---" line is your existing,
# already-working config (GitHub sync, BookOrbit, Paperless) -- unchanged.
# Only dawarich/airtrail/trek/plex were added as new providers; Dockhand,
# Synology, Trilium, Linkwarden, and Karakeep were tried here first but
# ended up on Homepage's own native widgets instead (see services.yaml
# and the separate Homepage-compose env vars below), so none of their
# secrets belong in stats-proxy's environment.
#
# Create these Bitwarden Secrets Manager secrets (exact names) before
# redeploying, if you haven't already:
#   DAWARICH_API_KEY
#   AIRTRAIL_TOKEN
#   TREK_API_KEY
#   PLEX_TOKEN

services:
  stats-proxy:
    image: ghcr.io/hello2ashu/stats-proxy:latest
    container_name: stats-proxy
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - /volume1/docker/homepage:/config
    environment:
      # --- GitHub -> Homepage sync (existing, unchanged) ---
      GITHUB_USER: hello2ashu
      GITHUB_TOKEN: ${github_pat}
      HOMEPAGE_CONFIG: /config/services.yaml
      HOMEPAGE_GROUP: GitHub
      DOCKHAND_URL: https://dockhand.ashish-syn-nas.synology.me
      DOCKHAND_TOKEN: ${DOCKHAND_TOKEN}
      SYNC_INTERVAL_SECS: "600"
      GITHUB_WEBHOOK_ ${GITHUB_WEBHOOK_SECRET}
      EXTRA_ARGS: --show-stars --sort updated --include-private --stale-groups "Repo List - Deployed,Repo List - Undeployed,Repo List - Legend"

      # --- BookOrbit stats provider (existing, unchanged) ---
      BOOKORBIT_URL: http://bookorbit:3211
      BOOKORBIT_USERNAME: ${BOOKORBIT_USERNAME}
      BOOKORBIT_PASSWORD: ${BOOKORBIT_PASSWORD}

      # --- Paperless stats provider (existing, unchanged) ---
      PAPERLESS_URL: http://paperless:8000
      PAPERLESS_TOKEN: ${paperlesstoken}

      # --- New providers ---
      DAWARICH_URL: https://dawarich.ashish-syn-nas.synology.me
      DAWARICH_API_KEY: ${DAWARICH_API_KEY}

      AIRTRAIL_URL: https://airtrail.ashish-syn-nas.synology.me/api/stats
      AIRTRAIL_TOKEN: ${AIRTRAIL_TOKEN}

      TREK_URL: https://trek.ashish-syn-nas.synology.me/api/v1/stats
      TREK_API_KEY: ${TREK_API_KEY}

      PLEX_URL: https://plex.ashish-syn-nas.synology.me
      PLEX_TOKEN: ${PLEX_TOKEN}
    networks:
      - default
      - bookorbit-deploy_default
      - paperless_default

networks:
  default: {}
  bookorbit-deploy_default:
    external: true
  paperless_default:
    external: true