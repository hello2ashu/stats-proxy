```yaml
name: Build and push stats-proxy image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stats-proxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      DOCKHAND_STATS_WEBHOOK_URL: ${{ secrets.DOCKHAND_STATS_WEBHOOK_URL }}
      DOCKHAND_STATS_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_STATS_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dockhand
        if: success() && env.DOCKHAND_STATS_WEBHOOK_URL != '' && env.DOCKHAND_STATS_WEBHOOK_SECRET != ''
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(cat <<EOF
          {
            "event": "image_pushed",
            "repository": "${{ github.repository }}",
            "image": "${{ env.IMAGE_NAME }}",
            "tag": "latest",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          )

          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 \
            -hmac "$DOCKHAND_STATS_WEBHOOK_SECRET" \
            | awk '{print $NF}')"

          echo "Triggering Dockhand deployment for ${IMAGE_NAME}:latest..."

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            -X POST "$DOCKHAND_STATS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD"

          echo "Dockhand notification sent successfully."
```
