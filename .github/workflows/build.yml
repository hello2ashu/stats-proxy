name: Build and push stats-proxy image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: stats-proxy-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stats-proxy
  CONTAINER_NAME: stats-proxy

jobs:
  build-and-deploy:
    # Must run on the Docker host so `docker inspect` sees the real container
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 1. Pre-check: is stats-proxy running? Remember its ID.
      # ------------------------------------------------------------
      - name: Pre-check current stats-proxy container
        shell: bash
        run: |
          set -uo pipefail
          OLD_ID=$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME" 2>/dev/null || true)

          if [ -z "$OLD_ID" ]; then
            echo "::warning::Container '$CONTAINER_NAME' does not exist (first deploy?)."
          else
            RUNNING=$(docker inspect -f '{{.State.Running}}' "$OLD_ID")
            RESTARTING=$(docker inspect -f '{{.State.Restarting}}' "$OLD_ID")
            echo "Current container: $OLD_ID (running=$RUNNING, restarting=$RESTARTING)"
            if [ "$RUNNING" != "true" ] || [ "$RESTARTING" = "true" ]; then
              echo "::warning::Current container is not healthy/running. Continuing with deploy."
              # To block the deploy instead, replace the line above with: exit 1
            fi
          fi

          echo "OLD_ID=$OLD_ID" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 2. Build and push
      # ------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stats-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # 3. Notify Dockhand (retries; missing ack is NOT fatal here)
      # ------------------------------------------------------------
      - name: Notify Dockhand
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DOCKHAND_STATS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_STATS_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail
          [ -n "${WEBHOOK_URL:-}" ]    || { echo "::error::DOCKHAND_STATS_WEBHOOK_URL not set"; exit 1; }
          [ -n "${WEBHOOK_SECRET:-}" ] || { echo "::error::DOCKHAND_STATS_WEBHOOK_SECRET not set"; exit 1; }

          cat > /tmp/dockhand-send.sh <<'SH'
          #!/usr/bin/env bash
          # Sends the webhook once; exit 0 on 2xx
          PAYLOAD=$(printf '{"event":"image_pushed","repository":"%s","image":"%s","tag":"latest","sha":"%s","branch":"%s"}' \
            "$GH_REPO" "$IMAGE_NAME" "$GH_SHA" "$GH_BRANCH")
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')"
          CODE=$(curl --silent --show-error --max-time 30 \
            --output /tmp/dockhand-response.txt --write-out '%{http_code}' \
            --request POST "$WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: $SIG" \
            --data-binary "$PAYLOAD" || echo "000")
          echo "Dockhand HTTP status: $CODE"
          [[ "$CODE" =~ ^2[0-9][0-9]$ ]]
          SH
          chmod +x /tmp/dockhand-send.sh

          export GH_REPO="${{ github.repository }}" GH_SHA="${{ github.sha }}" GH_BRANCH="${{ github.ref_name }}"
          export IMAGE_NAME WEBHOOK_URL WEBHOOK_SECRET

          for attempt in 1 2 3; do
            echo "Webhook attempt $attempt/3"
            if /tmp/dockhand-send.sh; then
              echo "Dockhand acknowledged."
              echo "DOCKHAND_ACKED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "::warning::No ack from Dockhand after 3 attempts. Will verify rollout anyway and re-send if needed."
          echo "DOCKHAND_ACKED=false" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. Verify rollout: new container created + started,
      #    old one removed, no restart loop
      # ------------------------------------------------------------
      - name: Verify rollout
        shell: bash
        timeout-minutes: 15
        env:
          WEBHOOK_URL: ${{ secrets.DOCKHAND_STATS_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_STATS_WEBHOOK_SECRET }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          CREATE_TIMEOUT=300     # wait for new container to appear
          REMOVE_TIMEOUT=120     # wait for old container to be removed
          STABLE_SECONDS=30      # must stay up this long with no restarts
          STABLE_TIMEOUT=300     # overall limit for reaching stability
          INTERVAL=5

          dump_logs() {
            echo "---------- docker ps (filtered) ----------"
            docker ps -a --filter "name=$CONTAINER_NAME" || true
            if [ -n "${1:-}" ]; then
              echo "---------- last 100 log lines ----------"
              docker logs --tail 100 "$1" 2>&1 || true
            fi
          }

          resend_webhook() {
            export GH_REPO="${{ github.repository }}" GH_BRANCH="${{ github.ref_name }}"
            export IMAGE_NAME WEBHOOK_URL WEBHOOK_SECRET
            /tmp/dockhand-send.sh && DOCKHAND_ACKED=true
          }

          # ---- A. New container created with the new image ----
          echo "== Waiting for NEW container (sha ${GH_SHA:0:7}) =="
          NEW_ID=""
          start=$SECONDS
          last_resend=$SECONDS
          while (( SECONDS - start < CREATE_TIMEOUT )); do
            CUR_ID=$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME" 2>/dev/null || true)
            if [ -n "$CUR_ID" ] && [ "$CUR_ID" != "${OLD_ID:-}" ]; then
              REV=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$CUR_ID" 2>/dev/null || true)
              if [ "$REV" = "$GH_SHA" ]; then
                NEW_ID="$CUR_ID"
                echo "New container created: $NEW_ID"
                break
              fi
              echo "Container exists but revision is '${REV:-none}', waiting..."
            else
              echo "No new container yet ($(( SECONDS - start ))s)..."
            fi

            # If Dockhand never acked, nudge it every 60s
            if [ "${DOCKHAND_ACKED:-false}" != "true" ] && (( SECONDS - last_resend >= 60 )); then
              echo "Re-sending Dockhand webhook..."
              resend_webhook || true
              last_resend=$SECONDS
            fi
            sleep $INTERVAL
          done

          if [ -z "$NEW_ID" ]; then
            echo "::error::New container was not created within ${CREATE_TIMEOUT}s."
            dump_logs "$(docker inspect -f '{{.Id}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            exit 1
          fi

          # ---- B. Old container removed ----
          if [ -n "${OLD_ID:-}" ]; then
            echo "== Waiting for OLD container to be removed =="
            start=$SECONDS
            while docker inspect "$OLD_ID" >/dev/null 2>&1; do
              if (( SECONDS - start >= REMOVE_TIMEOUT )); then
                echo "::error::Old container $OLD_ID still exists after ${REMOVE_TIMEOUT}s."
                dump_logs "$NEW_ID"
                exit 1
              fi
              echo "Old container still present ($(( SECONDS - start ))s)..."
              sleep $INTERVAL
            done
            echo "Old container removed."
          else
            echo "No previous container to remove."
          fi

          # ---- C. New container started and stable (no restart loop) ----
          echo "== Checking new container is stable =="
          stable=0
          start=$SECONDS
          while (( SECONDS - start < STABLE_TIMEOUT )); do
            STATE=$(docker inspect -f '{{.State.Status}}|{{.State.Restarting}}|{{.RestartCount}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$NEW_ID" 2>/dev/null || echo "gone|false|0|none")
            IFS='|' read -r status restarting restarts health <<< "$STATE"
            echo "status=$status restarting=$restarting restartCount=$restarts health=$health stable=${stable}s"

            if [ "$status" = "gone" ]; then
              echo "::error::New container disappeared (recreated or removed)."
              dump_logs ""; exit 1
            fi
            if [ "$restarting" = "true" ] || [ "$status" = "restarting" ] || [ "$restarts" -gt 0 ]; then
              echo "::error::Container is restarting / crash-looping (restartCount=$restarts)."
              dump_logs "$NEW_ID"; exit 1
            fi
            if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
              echo "::error::Container is $status."
              dump_logs "$NEW_ID"; exit 1
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "::error::Container reported UNHEALTHY."
              dump_logs "$NEW_ID"; exit 1
            fi

            if [ "$status" = "running" ] && { [ "$health" = "healthy" ] || [ "$health" = "none" ]; }; then
              stable=$((stable + INTERVAL))
            else
              stable=0   # created / starting health checks
            fi

            if (( stable >= STABLE_SECONDS )); then
              echo "Success: new container is running and stable for ${STABLE_SECONDS}s."
              exit 0
            fi
            sleep $INTERVAL
          done

          echo "::error::Container did not become stable within ${STABLE_TIMEOUT}s."
          dump_logs "$NEW_ID"
          exit 1

      # ------------------------------------------------------------
      # 5. Next step runs only if everything above succeeded
      # ------------------------------------------------------------
      - name: Next step
        run: echo "Deployment verified. Continue here..."
