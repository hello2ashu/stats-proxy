# File path: .github/workflows/build-and-push.yml
name: Build and push stats-proxy image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stats-proxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stats-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # Verify Container and Notify Dockhand
      # ------------------------------------------------------------
      - name: Verify Container and Notify Dockhand
        if: always()
        timeout-minutes: 15
        shell: bash
        env:
          DOCKHAND_STATS_WEBHOOK_URL: ${{ secrets.DOCKHAND_STATS_WEBHOOK_URL }}
          DOCKHAND_STATS_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_STATS_WEBHOOK_SECRET }}
          CONTAINER_NAME: "stats-proxy" 
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Checking Container Status"
          echo "=========================================="

          CONTAINER_READY=false
          MAX_ATTEMPTS=30
          WAIT_SECONDS=10

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            if docker ps --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}$"; then
              STATUS=$(docker inspect --format='{{rm-ansi .State.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "failed")
              HEALTH=$(docker inspect --format='{{rm-ansi .State.Health.Status}}' "$CONTAINER_NAME" 2>/dev/null || echo "none")

              echo "Attempt $i/$MAX_ATTEMPTS: Container state is '$STATUS', Health is '$HEALTH'"

              if [ "$STATUS" = "running" ]; then
                if [ "$HEALTH" = "starting" ]; then
                  echo "Container is running but still starting health checks..."
                elif [ "$HEALTH" = "unhealthy" ]; then
                  echo "ERROR: Container is running but reported UNHEALTHY."
                  exit 1
                else
                  echo "Success: Container is up and running."
                  CONTAINER_READY=true
                  break
                fi
              fi
            else
              echo "Attempt $i/$MAX_ATTEMPTS: Container '$CONTAINER_NAME' not found or not running yet."
            fi

            sleep $WAIT_SECONDS
          done

          if [ "$CONTAINER_READY" = "false" ]; then
            echo "ERROR: Container failed to start and stabilize within $((MAX_ATTEMPTS * WAIT_SECONDS)) seconds."
            exit 1
          fi

          echo "=========================================="
          echo "Dockhand notification"
          echo "=========================================="

          if [ -z "${DOCKHAND_STATS_WEBHOOK_URL:-}" ]; then
            echo "ERROR: DOCKHAND_STATS_WEBHOOK_URL is not configured."
            exit 1
          fi

          echo "Webhook URL: configured"

          if [ -z "${DOCKHAND_STATS_WEBHOOK_SECRET:-}" ]; then
            echo "ERROR: DOCKHAND_STATS_WEBHOOK_SECRET is not configured."
            exit 1
          fi

          echo "Webhook secret: configured"

          PAYLOAD=$(cat <<EOF
          {
            "event": "image_pushed",
            "repository": "${{ github.repository }}",
            "image": "${IMAGE_NAME}",
            "tag": "latest",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          )

          echo "Payload:"
          echo "$PAYLOAD"

          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 \
            -hmac "$DOCKHAND_STATS_WEBHOOK_SECRET" \
            | awk '{print $NF}')"

          echo "HMAC signature generated."
          echo "Sending webhook to Dockhand..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 600 \
            --output /tmp/dockhand-response.txt \
            --write-out "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            "$DOCKHAND_STATS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: $SIGNATURE" \
            --data "$PAYLOAD")

          echo "Dockhand HTTP status: $HTTP_STATUS"

          echo "Dockhand response:"
          cat /tmp/dockhand-response.txt || true

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dockhand notification sent successfully."
          else
            echo "ERROR: Dockhand webhook returned HTTP $HTTP_STATUS."
            exit 1
          fi
