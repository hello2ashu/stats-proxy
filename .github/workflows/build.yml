name: Build and push stats-proxy image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/stats-proxy

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stats-proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # Notify Dockhand
      # ------------------------------------------------------------
      - name: Notify Dockhand
        if: always()
        shell: bash
        env:
          DOCKHAND_STATS_WEBHOOK_URL: ${{ secrets.DOCKHAND_STATS_WEBHOOK_URL }}
          DOCKHAND_STATS_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_STATS_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Dockhand notification"
          echo "=========================================="

          # Verify webhook URL
          if [ -z "${DOCKHAND_STATS_WEBHOOK_URL:-}" ]; then
            echo "ERROR: DOCKHAND_STATS_WEBHOOK_URL is not configured."
            exit 1
          fi

          echo "Webhook URL: configured"

          # Verify webhook secret
          if [ -z "${DOCKHAND_STATS_WEBHOOK_SECRET:-}" ]; then
            echo "ERROR: DOCKHAND_STATS_WEBHOOK_SECRET is not configured."
            exit 1
          fi

          echo "Webhook secret: configured"

          # JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "event": "image_pushed",
            "repository": "${{ github.repository }}",
            "image": "${IMAGE_NAME}",
            "tag": "latest",
            "sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          )

          echo "Payload:"
          echo "$PAYLOAD"

          # Generate GitHub-compatible HMAC signature
          SIGNATURE="sha256=$(printf '%s' "$PAYLOAD" \
            | openssl dgst -sha256 \
            -hmac "$DOCKHAND_STATS_WEBHOOK_SECRET" \
            | awk '{print $NF}')"

          echo "HMAC signature generated."
          echo "Sending webhook to Dockhand..."

          # Send webhook
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/dockhand-response.txt \
            --write-out "%{http_code}" \
            --retry 3 \
            --retry-delay 2 \
            --request POST \
            "$DOCKHAND_STATS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: $SIGNATURE" \
            --data "$PAYLOAD")

          echo "Dockhand HTTP status: $HTTP_STATUS"

          echo "Dockhand response:"
          cat /tmp/dockhand-response.txt || true

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Dockhand notification sent successfully."
          else
            echo "ERROR: Dockhand webhook returned HTTP $HTTP_STATUS."
            exit 1
          fi
